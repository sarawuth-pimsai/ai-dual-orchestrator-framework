[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-dual-orchestrator-bootstrap"
version = "0.1.0"
description = "Pinned project bootstrap for the AI Dual-Orchestrator Framework"
requires-python = ">=3.9"

[project.scripts]
ai-framework = "ai_framework.__main__:main"

[tool.setuptools]
packages = ["ai_framework"]
